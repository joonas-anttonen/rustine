# Font render sizes (in points) and character sets
# 
# Each font can specify:
#   size     - Font render size in points (default: 16.0)
#   charset  - Character set type: "latin1" or "unicode" (default: "latin1")
#   codepoints - For unicode charset, list of hex ranges or individual codes
#              Example ranges: "0xe000-0xe00f", "0xf100", "0x1234-0x5678"

[fonts.ProggyClean]
size = 16.0
charset = "latin1"

[fonts.DepartureMono]
size = 22.0
charset = "latin1"

[fonts.CaskaydiaMono]
size = 16.0
charset = "unicode"
codepoints = [
    "0x0000-0x00ff", # Basic Latin
    "0x0100-0x017f", # Latin Extended-A
    "0x0180-0x024f", # Latin Extended-B
    "0x0250-0x02af", # IPA Extensions
    "0x02b0-0x02ff", # Spacing Modifier Letters
    "0x0300-0x036f", # Combining Diacritical Marks
    "0x0370-0x03ff", # Greek and Coptic
    "0x0400-0x04ff", # Cyrillic
    "0x0500-0x052f", # Cyrillic Supplement
    "0x1e00-0x1eff", # Latin Extended Additional
    "0x2000-0x206f", # General Punctuation
    "0x2070-0x209f", # Superscripts and Subscripts
    "0x20a0-0x20cf", # Currency Symbols
    "0x20d0-0x20ff", # Combining Diacritical Marks for Symbols
    "0x2100-0x214f", # Letterlike Symbols
    "0x2150-0x218f", # Number Forms
    "0x2190-0x21ff", # Arrows
    "0x2200-0x22ff", # Mathematical Operators
    "0x2300-0x23ff", # Miscellaneous Technical
    "0x2400-0x243f", # Control Pictures
    "0x2440-0x245f", # Optical Character Recognition
    "0x2460-0x24ff", # Enclosed Alphanumerics
    "0x2500-0x257f", # Box Drawing
    "0x2580-0x259f", # Block Elements
    "0x25a0-0x25ff", # Geometric Shapes
    "0x2600-0x26ff", # Miscellaneous Symbols
    "0x2700-0x27bf", # Dingbats
]

[fonts.NerdSymbolsMono]
size = 22.0
charset = "unicode"
codepoints = [
    "0xf1eb", # nf-fa-wifi
    "0xf293", # nf-fa-bluetooth
    "0xec19", # nf-cod-chip
    "0xe745", # nf-dev-firefox
    "0xe8da", # nf-dev-vscode
    "0xe702", # nf-dev-git
    "0xea68", # nf-cod-source_control
    "0xea85", # nf-cod-terminal
    "0xe843", # nf-dev-nixos
    "0xf1b6", # nf-fa-steam
    "0xe725", # nf-dev-git_branch
    "0xeb51", # nf-cod-settings_gear
    "0xf01d8", # nf-md-dots_horizontal
    "0xf104", # nf-fa-angle_left
    "0xf105", # nf-fa-angle_right
    "0xf106", # nf-fa-angle_up
    "0xf107", # nf-fa-angle_down
    "0xf021", # nf-fa-refresh
    "0xeb94", # nf-cod-menu
    "0xea76", # nf-cod-close
    "0xea60", # nf-cod-add
]
