[package]
name = "rustine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustine-app"
path = "src/main.rs"

[lib]
name = "rustine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustine-sc = { path = "../rustine-sc" }
chrono = ">=0.4"
libc = ">=0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
rustine-sc = { path = "../rustine-sc" }
cmake = ">=0.1"
fontdue = ">=0.9"
toml = ">=0.8"
