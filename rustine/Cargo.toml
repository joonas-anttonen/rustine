[package]
name = "rustine"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustine-sc = { path = "../rustine-sc" }
chrono = ">=0.4"
libc = ">=0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nalgebra = "0.34.1"

[build-dependencies]
rustine-sc = { path = "../rustine-sc" }
rustine-fc = { path = "../rustine-fc" }
cmake = ">=0.1"
toml = ">=0.8"
